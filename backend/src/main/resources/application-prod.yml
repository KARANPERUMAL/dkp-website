server:
  port: ${PORT:8080}
  address: 0.0.0.0

spring:
  config:
    activate:
      on-profile: prod
  jpa:
    show-sql: false

springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:false}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:false}

management:
  endpoint:
    health:
      show-details: never
